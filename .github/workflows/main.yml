name: Build & Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]

env:
  WEB_EXT_IGNORE: --ignore-files ".github/**" "dist/**" "README.md"

jobs:
  # ─── Lint ───────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install web-ext
        run: npm install -g web-ext

      - name: Validate add-on
        run: web-ext lint --source-dir . ${{ env.WEB_EXT_IGNORE }}

  # ─── Release (only when a GitHub release is published) ──────────────────────
  release:
    name: Publish to AMO
    runs-on: ubuntu-latest
    needs: lint
    if: github.event_name == 'release'
    permissions:
      contents: write
    env:
      AMO_API_KEY: ${{ secrets.AMO_API_KEY }}
      AMO_API_SECRET: ${{ secrets.AMO_API_SECRET }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install web-ext
        run: npm install -g web-ext

      # The release tag decides the version, so manifest.json need not be bumped by hand.
      - name: Set manifest version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+){0,3}$ ]]; then
            echo "::error::Tag $GITHUB_REF_NAME is not a valid add-on version (e.g. 1.2 or v1.2.3)"
            exit 1
          fi
          VERSION="$VERSION" node -e '
            const fs = require("fs");
            const manifest = JSON.parse(fs.readFileSync("manifest.json", "utf8"));
            manifest.version = process.env.VERSION;
            fs.writeFileSync("manifest.json", JSON.stringify(manifest, null, 2) + "\n");
          '
          echo "Version set to $VERSION"

      - name: Check AMO secrets
        run: |
          if [ -z "$AMO_API_KEY" ] || [ -z "$AMO_API_SECRET" ]; then
            echo "::error::Secrets AMO_API_KEY and AMO_API_SECRET are missing (Settings → Secrets and variables → Actions)"
            exit 1
          fi

      # Uploads the new version to addons.mozilla.org. Once Mozilla approves it,
      # every existing user gets the update automatically through Firefox.
      - name: Submit to AMO
        run: |
          web-ext sign \
            --source-dir . \
            --artifacts-dir ./dist \
            ${{ env.WEB_EXT_IGNORE }} \
            --channel listed \
            --api-key "$AMO_API_KEY" \
            --api-secret "$AMO_API_SECRET" \
            --approval-timeout 0

      - name: Build add-on
        run: |
          web-ext build \
            --source-dir . \
            --artifacts-dir ./dist \
            ${{ env.WEB_EXT_IGNORE }} \
            --overwrite-dest

      - name: Attach build to the release
        run: gh release upload "$GITHUB_REF_NAME" dist/*.zip --clobber
