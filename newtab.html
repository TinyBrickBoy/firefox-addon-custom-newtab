<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title data-i18n="newTabTitle">New Tab</title>
  <style>
    :root { color-scheme: light dark; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font: 15px/1.5 system-ui, sans-serif;
      background: Canvas;
      color: CanvasText;
    }
    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
    }
    #hint {
      max-width: 32rem;
      margin: 20vh auto 0;
      padding: 0 16px;
      text-align: center;
    }
    button { font: inherit; padding: 0.4em 1em; cursor: pointer; }
  </style>
</head>
<body>
  <div id="hint" hidden>
    <p id="hint-text" data-i18n="hintNoUrl"></p>
    <button id="open-options" type="button" data-i18n="openOptions"></button>
  </div>
  <script src="settings.js"></script>
  <script src="newtab.js"></script>
</body>
</html>
